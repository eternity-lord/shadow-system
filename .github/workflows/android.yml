name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Post error excerpt on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "CI failure excerpt (first 60 KB):"
            grep -E "^e: |^w: .*Unresolved|FAILED|What went wrong|Could not|Execution failed|error:|Caused by|AssertionError|expected" -A4 build.log | head -c 60000
          } > excerpt.txt || true
          gh api "repos/$REPO/commits/$SHA/comments" -F body=@excerpt.txt || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-system-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
